  <title>树下小憩 · 树与草地第一版</title>
  <desc>原创分层矢量场景；透明画布。图层从后至前：草地、接地阴影、树干、树冠、前景草。
    本文件不含第三方角色。建议以 360×360 DIP 显示；角色画布为 168×168 DIP。
    预览角色画布左上角为源坐标 (336,274)，画布大小 336×336；保留帧原始画布，不逐帧裁边或贴地。
    树根锚点 (238,590)，角色地面参考线 y=604；树冠摆动参考点 (260,326)。
    完整场景保持同一画布导出，各独立图层不得自动裁剪。前景草绘制于角色前，其他图层在角色后。
  </desc>
