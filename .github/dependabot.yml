version: 2
updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: "Asia/Shanghai"
    groups:
      test-tooling:
        patterns:
          - "Microsoft.NET.Test.Sdk"
          - "MSTest.*"
          - "coverlet.collector"
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "04:30"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
