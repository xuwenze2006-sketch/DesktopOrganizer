name: Windows CI

"on":
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-publish:
    name: Build, test and publish
    runs-on: windows-2025
    timeout-minutes: 30

    env:
      CI: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
      DOTNET_NOLOGO: "true"
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Build, test and publish
        shell: pwsh
        run: ./scripts/ci.ps1

      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: DesktopOrganizer-test-results-${{ github.run_number }}
          path: artifacts/test-results/**
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Windows x64 build
        uses: actions/upload-artifact@v6
        with:
          name: DesktopOrganizer-win-x64-${{ github.sha }}
          path: |
            artifacts/DesktopOrganizer-win-x64.zip
            artifacts/DesktopOrganizer-win-x64.sha256
          if-no-files-found: error
          retention-days: 14
